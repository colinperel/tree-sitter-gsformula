name: CI

on:
  # Manual runs: paths-filtered push events don't fire on force-pushes of
  # rewritten history, which left rewritten heads unverified.
  workflow_dispatch:
  # The version manifests appear in both filters below because
  # `tree-sitter version` rewrites exactly those six files and nothing else.
  # Without them a release commit touches no filtered path and gets no CI at
  # all — which is how a src/parser.c whose embedded metadata version was
  # still 0.2.0 reached the v0.3.0 tag unverified.
  push:
    branches:
      - master
      - main
    paths:
      - grammar.js
      - src/**
      - test/**
      - bindings/**
      - binding.gyp
      - queries/**
      - examples/**
      - .github/workflows/ci.yml
      - tree-sitter.json
      - Cargo.toml
      - package.json
      - pyproject.toml
      - CMakeLists.txt
      - Makefile
  pull_request:
    paths:
      - grammar.js
      - src/**
      - test/**
      - bindings/**
      - binding.gyp
      - queries/**
      - examples/**
      - .github/workflows/ci.yml
      - tree-sitter.json
      - Cargo.toml
      - package.json
      - pyproject.toml
      - CMakeLists.txt
      - Makefile

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

jobs:
  test:
    name: Test parser
    runs-on: ${{matrix.os}}
    if: >-
      !github.event.repository.is_template &&
      github.event.head_commit.message != 'Initial commit'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up tree-sitter
        uses: tree-sitter/setup-action/cli@v2
      - name: Run tests
        uses: tree-sitter/parser-test-action@v3
        with:
          test-rust: ${{runner.os == 'Linux'}}
          test-node: true
          test-python: true
          test-go: true
          # No Swift toolchain on the Linux/Windows runners.
          test-swift: ${{runner.os == 'macOS'}}
      # The one binding parser-test-action cannot exercise. One OS is
      # enough: the CMakeLists is platform-agnostic and the point is that
      # it configures and compiles at all.
      - name: Build C binding
        if: runner.os == 'Linux'
        run: |
          cmake -B build
          cmake --build build

  # Real formulas must parse clean and every query must capture what it
  # captured yesterday — this is the gate README.md promises.
  # `tree-sitter parse -q` exits nonzero on any ERROR/MISSING node; the
  # golden diff catches patterns that lint clean but silently changed (or
  # lost) their captures. Regeneration recipe: test/query-goldens/README.md.
  examples:
    name: Parse examples
    runs-on: ubuntu-latest
    if: >-
      !github.event.repository.is_template &&
      github.event.head_commit.message != 'Initial commit'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up tree-sitter
        uses: tree-sitter/setup-action/cli@v2
      - name: Build parser
        run: tree-sitter build
      - name: Parse examples
        run: tree-sitter parse -q examples/*.gsfx
      - name: Diff query captures against goldens
        # Regenerate into a temp dir and compare recursively so a missing
        # golden for a new query, or a stale golden for a deleted one,
        # fails alongside content drift — an in-place `git diff` sees
        # neither.
        run: |
          tmp="$(mktemp -d)"
          for q in queries/*.scm; do
            tree-sitter query "$q" examples/*.gsfx > "$tmp/$(basename "$q" .scm).txt"
          done
          diff -ru -x README.md test/query-goldens "$tmp"

  # examples/ mirrors six goldens whose canonical copies live in gsfmt's
  # tests/data/. gsfmt's own CI pins its checkout of this repo to a release
  # tag, so drift introduced *here* would otherwise go unnoticed until the
  # next release pair — this is the reciprocal guard. Canonical repo is
  # checked out at its default branch on purpose: if gsfmt's goldens moved,
  # this repo is stale and red is the correct signal.
  fixtures:
    name: Fixture sync
    runs-on: ubuntu-latest
    if: >-
      !github.event.repository.is_template &&
      github.event.head_commit.message != 'Initial commit'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Checkout gsfmt (canonical)
        uses: actions/checkout@v6
        with:
          repository: colinperel/gsfmt
          path: gsfmt
      - name: Diff examples against canonical goldens
        run: |
          status=0
          for f in gnarly gnarly.min monthly monthly.min payperiods payperiods.min; do
            if ! diff -u "gsfmt/tests/data/$f.gsfx" "examples/$f.gsfx"; then
              status=1
            fi
          done
          if [ "$status" -ne 0 ]; then
            echo "::error::fixtures drifted — gsfmt tests/data/ is canonical; sync examples/ to match"
          fi
          exit "$status"

  query:
    name: Validate queries
    runs-on: ubuntu-latest
    steps:
      - name: Set up repository
        uses: actions/checkout@v6

      - name: Set up tree-sitter
        uses: tree-sitter/setup-action/cli@v2

      - name: Build parser
        run: tree-sitter build

      - name: Set up ts_query_ls
        run: curl -fL https://github.com/ribru17/ts_query_ls/releases/latest/download/ts_query_ls-x86_64-unknown-linux-gnu.tar.gz | tar -xz

      - name: Check queries
        run: ./ts_query_ls check -f queries/
